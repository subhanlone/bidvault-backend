name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma resolves the datasource URL when it reads the schema, so the
  # variable has to exist even though nothing here opens a connection.
  # This is a throwaway value, not a credential.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Matches @types/node in devDependencies, which is what tsc checks
      # the source against.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Catches malformed schema changes before Railway runs
      # `prisma migrate deploy` on boot.
      - run: npx prisma validate

      # The client has to exist before tsc can resolve @prisma/client's types.
      - run: npx prisma generate

      - run: npm run build

      # openapi.json is committed and the frontend generates its types from it, so a stale
      # copy silently ships wrong types to the client. Regenerate and fail on any diff.
      - name: openapi.json is up to date
        run: |
          npm run api:contract
          git diff --exit-code -- openapi.json \
            || { echo "::error::openapi.json is stale — run 'npm run api:contract' and commit the result"; exit 1; }

      # The client-type emitter throws on any schema construct it does not recognise. Without
      # this, adding one would pass CI and only fail when someone regenerated locally. Writes
      # to a scratch path because the frontend is not checked out here.
      - name: client types still emit
        run: API_TYPES_OUT="${RUNNER_TEMP}/openapi.d.ts" npm run api:types

      # document.ts lists paths and operations by hand — the one hand-maintained link in an
      # otherwise generated chain. This walks the live Express router and fails if a route is
      # served but undocumented, or documented but no longer served.
      - name: openapi.json matches the served routes
        run: npm run api:routes
