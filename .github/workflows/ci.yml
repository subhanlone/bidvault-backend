name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every value here is a throwaway placeholder, not a credential. Nothing in this
# workflow opens a connection or calls an external service — these exist only to get
# past validation.
#
# Locally the backend has no dotenv dependency at all: `.env` reaches process.env as a
# side effect of importing @prisma/client, which loads it. There is no such file on a
# runner, so config/env.ts sees a bare process.env and every required variable has to be
# supplied here. `npm run api:routes` boots the real Express app, so it needs all of them.
env:
  # Prisma resolves the datasource URL when it reads the schema, so the
  # variable has to exist even though nothing here opens a connection.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder_not_a_real_key
  CLOUDINARY_CLOUD_NAME: ci-placeholder
  CLOUDINARY_API_KEY: ci-placeholder
  CLOUDINARY_API_SECRET: ci-placeholder
  # config/env.ts requires at least 16 characters for both JWT secrets.
  JWT_ACCESS_SECRET: ci-placeholder-not-a-real-secret
  JWT_REFRESH_SECRET: ci-placeholder-not-a-real-secret

defaults:
  run:
    # Both repos are checked out side by side so the layout matches a developer's
    # machine exactly — see the "frontend types are in sync" step for why that matters.
    working-directory: backend

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: backend

      # The client-type emitter writes into the frontend as a sibling directory. Bringing it
      # in here is what lets CI compare the committed types against this contract rather
      # than just proving the emitter runs.
      #
      # A plain anonymous clone rather than actions/checkout: that action injects the job's
      # GITHUB_TOKEN, which is scoped to *this* repository, and its own README says a PAT is
      # required to check out a different one. Both repos are public, so cloning without
      # credentials sidesteps the question and keeps this workflow secret-free.
      - name: clone the frontend alongside
        working-directory: ${{ github.workspace }}
        run: git clone --depth 1 --branch master https://github.com/subhanlone/bidvault.git frontend

      # Matches @types/node in devDependencies, which is what tsc checks
      # the source against.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Catches malformed schema changes before Railway runs
      # `prisma migrate deploy` on boot.
      - run: npx prisma validate

      # The client has to exist before tsc can resolve @prisma/client's types.
      - run: npx prisma generate

      - run: npm run build

      # `build` compiles src/** only, because tests and codegen scripts must not reach
      # dist. This checks those too — vitest and tsx transpile without typechecking, so
      # without it a type error in a test or in the contract emitter has nowhere to surface.
      - run: npm run typecheck

      # openapi.json is committed and the frontend generates its types from it, so a stale
      # copy silently ships wrong types to the client. Regenerate and fail on any diff.
      - name: openapi.json is up to date
        run: |
          npm run api:contract
          git diff --exit-code -- openapi.json \
            || { echo "::error::openapi.json is stale — run 'npm run api:contract' and commit the result"; exit 1; }

      # Regenerates the frontend's types into the sibling checkout and fails if they differ
      # from what the frontend has committed.
      #
      # This replaces an earlier step that emitted to a scratch path and discarded the
      # result. That only proved the emitter did not crash: a contract change with no
      # matching regeneration left both repos' CI green while the frontend compiled against
      # a contract that no longer existed.
      #
      # Running the emitter with its default output path also exercises the same resolution
      # a developer gets locally, so a break in that path fails here too.
      #
      # Note the ordering consequence: if a contract change lands in this repo before the
      # regenerated types land in the frontend, this step fails until the frontend catches
      # up. That is the intended reading — the deployed pair really is inconsistent in that
      # window.
      - name: frontend types are in sync with this contract
        run: |
          npm run api:types
          cd "${GITHUB_WORKSPACE}/frontend"
          git diff --exit-code -- src/types/openapi.d.ts || {
            echo "::error::frontend/src/types/openapi.d.ts does not match this contract."
            echo "::error::In the backend run 'npm run api:contract && npm run api:types', then commit the frontend."
            exit 1
          }

      # document.ts lists paths and operations by hand — the one hand-maintained link in an
      # otherwise generated chain. This walks the live Express router and fails if a route is
      # served but undocumented, or documented but no longer served.
      - name: openapi.json matches the served routes
        run: npm run api:routes

  test:
    name: Tests
    runs-on: ubuntu-latest

    # A real Postgres and a real Redis. The suite talks to both: routes read and write
    # rows, and approving a listing enqueues a BullMQ job.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bidvault
          POSTGRES_PASSWORD: bidvault
          POSTGRES_DB: bidvault_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bidvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Overrides the workflow-level values. tests/setup.ts refuses to run unless the
    # database name ends in _test, the Redis host is loopback and QUEUE_PREFIX is not
    # production's 'bull' — so these are load-bearing, not decoration.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bidvault:bidvault@localhost:5432/bidvault_test
      REDIS_URL: redis://127.0.0.1:6379
      QUEUE_PREFIX: bull:test

    steps:
      - uses: actions/checkout@v5
        with:
          path: backend

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      # Nothing else compares the migration history to schema.prisma. A model edited
      # without a matching migration builds, passes prisma validate, and then diverges
      # from production the moment it deploys. A fresh database plus this check is the
      # only place that shows up.
      - name: migrations reproduce schema.prisma
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
            && echo "no drift" \
            || { echo "::error::The migrations do not reproduce schema.prisma — a model was changed without a migration"; exit 1; }

      - run: npm test
